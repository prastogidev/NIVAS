[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --ignore=backend/tests/test_e2e_delhi_localities.py --ignore=backend/tests/test_live_demo_edge_cases.py
filterwarnings =
    ignore::DeprecationWarning